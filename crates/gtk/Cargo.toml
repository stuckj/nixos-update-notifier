[package]
name = "nixos-update-notifier-gtk"
description = "GTK client for nixos-update-notifier — talks to the daemon over D-Bus"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "nixos-update-notifier-gtk"
path = "src/main.rs"

[dependencies]
nun-core = { path = "../core" }
# The only crate in the workspace that links GTK system libraries.
gtk = { package = "gtk4", version = "0.9", features = ["v4_10"] }
# Blocking D-Bus proxy to the daemon (pure Rust).
zbus = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
