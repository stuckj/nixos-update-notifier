[package]
name = "nixos-update-notifier"
description = "Tray daemon + CLI for flake-based NixOS update notification"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
default-run = "nixos-update-notifier"

[[bin]]
name = "nixos-update-notifier"
path = "src/main.rs"

[dependencies]
nun-core = { path = "../core" }
# Pure-Rust deps only — the daemon links NO system C libraries (ksni 0.3 uses zbus).
# So CI can build this on bare Ubuntu with no apt packages.
ksni = "0.3"
tokio = { workspace = true }
zbus = { workspace = true }
serde_json = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
