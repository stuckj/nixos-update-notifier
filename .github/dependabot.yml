# Dependabot configuration.
#
# Scope note: automatic PRs for *security alerts* do not come from this file — they are the
# repository's "Dependabot security updates" setting, which is already enabled and works
# without any config. What this file adds is scheduled *version* updates: routine bumps that
# arrive before a CVE does, so a security PR lands on a dependency tree that is already close
# to current instead of years behind it.
#
# The groups below deliberately do not carry `applies-to: security-updates`, so a security
# fix still arrives as its own PR. That one you want to read and merge on its own, not
# bundled behind an unrelated major bump.
#
# Nix inputs are deliberately absent: Dependabot has no flake ecosystem. `flake.lock` is
# advanced by this project's own update checker, which is the thing being built here.
version: 2

updates:
  # Rust dependencies. One entry covers every crate: `crates/*` all take their versions from
  # [workspace.dependencies] in the root Cargo.toml, so that is the only manifest to watch.
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Everything in one PR, majors included. Splitting majors out sounded right and was
      # not: the first run opened seven PRs, six of them majors, which is the queue this is
      # meant to avoid. The lockfile is committed and every bump faces the same CI either
      # way, so grouping costs no coverage.
      #
      # The trade is real, though: one grouped PR is harder to bisect than six small ones,
      # and a single failing bump blocks the rest of the group until it is excluded here.
      cargo:
        patterns:
          - "*"
    commit-message:
      prefix: deps

  # The workflows' own actions. Easy to forget precisely because nothing in the code
  # references them, and a stale action is how a release pipeline quietly rots.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: ci
