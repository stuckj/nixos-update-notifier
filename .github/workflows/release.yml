name: Release

# Release flow modelled on stuckj/mkvdup (incl. PR #200 and the PR #207 canary rework),
# adapted for a Rust + Nix flake:
#
#   prepare  → resolve version/tag/commit/is_canary; check the REMOTE for an existing tag.
#   sync-version → write the version into the source ON THE RELEASED REF and commit it, so
#                  the tag carries its own version (`--version` and the Nix store path are
#                  correct). Canaries are cut from development branches, so this commits to
#                  that branch — never to main-regardless-of-dispatch, which #207 fixed.
#   build    → build the package from the version-bumped commit; assemble a tarball.
#   release  → create the tag (at the bumped commit, via target_commitish) AND the GitHub
#              release, only after the build passed. `-canary.` versions are pre-releases.
#
# There is no canary "channel": the flake ref is the selector, so a canary installs with
#   nix profile install github:stuckj/nixos-update-notifier/<branch-or-tag>#default
# And there is no vendorHash to refresh (cargoLock.lockFile vendors from the committed
# Cargo.lock) — the whole class of problem #207's hash job solves does not exist here.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without v prefix (e.g. 1.2.3, or 1.2.3-canary.1 for a canary)'
        required: true
      commit:
        description: 'Commit SHA to release (optional; defaults to the head of the dispatched branch)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      commit: ${{ steps.resolve.outputs.commit }}
      tag: ${{ steps.resolve.outputs.tag }}
      is_canary: ${{ steps.resolve.outputs.is_canary }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version and commit
        id: resolve
        # Inputs are passed through `env:` and referenced as shell variables. Never splice
        # `${{ … }}` directly into a `run:` block: that is template-substituted into the
        # script text before bash parses it, so a value containing shell metacharacters
        # would execute in a job that holds `contents: write`.
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          INPUT_COMMIT: ${{ github.event.inputs.commit }}
          BRANCH: ${{ github.ref_name }}
        run: |
          VERSION="$INPUT_VERSION"

          if [[ ! "$VERSION" =~ ^[0-9]+(\.[0-9]+)*([.-][0-9A-Za-z]+)*$ ]]; then
            echo "::error::Invalid version '${VERSION}'. Expected e.g. '1.2.3' or '1.2.3-canary.1'."
            exit 1
          fi

          TAG="v${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

          IS_CANARY=false
          [[ "$VERSION" == *-canary.* ]] && IS_CANARY=true
          echo "is_canary=${IS_CANARY}" >> "$GITHUB_OUTPUT"

          # Check the REMOTE for the tag (checkout history may not carry all tags).
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "::error::Tag ${TAG} already exists on origin"
            exit 1
          fi

          if [[ -n "$INPUT_COMMIT" ]]; then
            COMMIT=$(git rev-parse "$INPUT_COMMIT")
          else
            COMMIT=$(git rev-parse "origin/${BRANCH}")
          fi
          echo "commit=${COMMIT}" >> "$GITHUB_OUTPUT"
          echo "Will release ${TAG} at ${COMMIT} (canary=${IS_CANARY}) on branch ${BRANCH}"

  sync-version:
    # Writes the version into the source on the released ref, so the tag created by the
    # release job actually contains it. Runs before build so the built artifact reports
    # the right version too.
    needs: prepare
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.sync.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          # This job pushes the version bump to the released branch. With a ruleset
          # requiring pull requests on that branch, the default GITHUB_TOKEN cannot: it
          # authenticates as github-actions[bot], and role-based bypasses (Maintain, Write)
          # match USERS holding those roles — a bot account holds none, so it is refused
          # with GH013 no matter which roles are on the bypass list. GitHub does not offer
          # github-actions[bot] itself as a bypass actor on personal repositories.
          #
          # RELEASE_PAT is a token belonging to a human with a bypassing role, so the push
          # is evaluated as that person. Falls back to github.token, which is fine on a
          # repo whose branch is unprotected.
          token: ${{ secrets.RELEASE_PAT || github.token }}
      - uses: dtolnay/rust-toolchain@stable

      - name: Write version onto the released ref
        id: sync
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ needs.prepare.outputs.tag }}
          WANT_COMMIT: ${{ needs.prepare.outputs.commit }}
          BRANCH: ${{ github.ref_name }}
        run: |
          HEAD_SHA=$(git rev-parse HEAD)

          # Only write the bump when releasing the branch head; a bump committed here would
          # land on the head, so tagging a different requested commit would be wrong. In
          # that case, tag exactly what prepare resolved.
          if [[ "$WANT_COMMIT" != "$HEAD_SHA" ]]; then
            echo "Releasing a specific commit (${WANT_COMMIT}), not branch head — not writing a bump."
            echo "commit=${WANT_COMMIT}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          scripts/set-version.sh "$VERSION"
          git add -A
          if git diff --staged --quiet; then
            echo "Version already ${VERSION}; nothing to commit."
            echo "commit=${HEAD_SHA}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Release ${TAG} [skip ci]"
          if ! git push origin "HEAD:${BRANCH}"; then
            # Overwhelmingly the cause is a branch ruleset refusing the bot. Say so, rather
            # than leaving a bare GH013 to be decoded again.
            echo "::error::Could not push the version bump to ${BRANCH}. If the push was \
          refused by a repository rule (GH013), set the RELEASE_PAT secret to a token \
          belonging to a user whose role is on the ruleset's bypass list — the default \
          GITHUB_TOKEN authenticates as github-actions[bot], which no role-based bypass \
          matches."
            exit 1
          fi
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: [prepare, sync-version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.sync-version.outputs.commit }}
      - uses: DeterminateSystems/nix-installer-action@main

      - name: Build package
        run: nix build -L

      - name: Assemble release tarball
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          NAME="nixos-update-notifier_${VERSION}_x86_64-linux"
          mkdir -p "staging/${NAME}"
          cp -rL result/bin "staging/${NAME}/bin"
          cp -rL result/share "staging/${NAME}/share" 2>/dev/null || true
          cp README.md LICENSE "staging/${NAME}/"
          tar -C staging -czf "${NAME}.tar.gz" "${NAME}"
          sha256sum "${NAME}.tar.gz" | tee "${NAME}.tar.gz.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            *.tar.gz
            *.sha256

  release:
    needs: [prepare, sync-version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: dist

      - run: ls -la dist/

      # Creates the tag (at the version-bumped commit, via target_commitish) as well as the
      # release — so the tag exists only after the build succeeded and carries its version.
      # Canary → pre-release.
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ needs.sync-version.outputs.commit }}
          name: ${{ needs.prepare.outputs.tag }}
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ needs.prepare.outputs.is_canary == 'true' }}
