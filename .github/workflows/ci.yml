name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Tier 1: fast pure-logic tests + lint. The core and daemon crates link NO system
  # libraries (ksni 0.3 / zbus / tokio are pure Rust), so this runs on a bare runner with
  # no apt packages. The GTK crate is intentionally excluded here — it is exercised by the
  # `nix` job below.
  lint-test:
    name: lint + unit tests (no system deps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy (core + daemon)
        run: cargo clippy -p nun-core -p nixos-update-notifier --all-targets -- -D warnings
      - name: unit tests (core + daemon)
        run: cargo test -p nun-core -p nixos-update-notifier
      - name: shellcheck scripts
        run: shellcheck scripts/*.sh

  # The declared `rust-version`, read from Cargo.toml. Every other job builds with a newer
  # compiler, so without this a dependency that raises its own minimum passes CI while ours
  # stops building. GTK is left out for the same reason as above.
  msrv:
    name: check on declared rust-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: read rust-version
        id: msrv
        run: |
          v=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)
          test -n "$v" || { echo "::error::no rust-version in Cargo.toml"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
      - name: cargo check (core + daemon)
        # Overrides rust-toolchain.toml, which pins `stable`.
        env:
          RUSTUP_TOOLCHAIN: ${{ steps.msrv.outputs.version }}
        run: cargo check --locked -p nun-core -p nixos-update-notifier --all-targets

  # Tier 2: build the whole flake (package incl. the GTK client + both Nix modules) and run
  # the in-sandbox test suite. This is what proves the GUI compiles and the flake is sound.
  nix:
    name: nix flake check + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@main
      - name: flake check
        run: nix flake check -L
      - name: build package
        run: nix build -L

  # Tier 2b: scripts/plasma-smoke-test.sh unattended in a NixOS VM running a real Plasma 6
  # Wayland session: SNI tray registration, notifications, the D-Bus service and the GTK
  # client against the daemon. Runs the test driver directly rather than `nix build` so the
  # screenshots survive a failure.
  plasma-smoke:
    name: Plasma smoke test (NixOS VM)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@main
      - name: build the VM test driver
        run: nix build -L .#vmTests.plasma-smoke.driver
      - name: run the smoke test in the VM
        run: |
          mkdir -p smoke-out
          ./result/bin/nixos-test-driver --output_directory smoke-out
      - name: upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: plasma-smoke-screenshots
          path: smoke-out/
          if-no-files-found: ignore

  # Tier 3: integration tests that drive the REAL `nix` invocations against tiny committed
  # fixture flakes — input listing and the `nix store diff-closures` output format. These
  # guard the parser against Nix-version output drift. They are `#[ignore]`d so they only
  # run where `nix` is available (here, inside the devShell).
  integration:
    name: fixture-flake integration (real nix)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@main
      - name: run ignored integration tests
        run: nix develop -c cargo test -p nun-core --test integration -- --ignored --test-threads=1
