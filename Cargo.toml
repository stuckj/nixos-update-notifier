[workspace]
resolver = "2"
members = ["crates/core", "crates/daemon", "crates/gtk"]

[workspace.package]
version = "0.9.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"
repository = "https://github.com/stuckj/nixos-update-notifier"

# Shared dependency versions, referenced from member crates with `.workspace = true`.
[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "sync", "time", "signal", "fs"] }
zbus = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
directories = "5"
# Only for killpg(2) when cancelling a rebuild: killing nixos-rebuild alone orphans the
# `nix build` it spawned, which keeps downloading. Already in the tree via tokio.
libc = "0.2"

[profile.release]
lto = "thin"
strip = true
