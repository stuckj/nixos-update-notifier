# nixos-update-notifier configuration.
# Copy to $XDG_CONFIG_HOME/nixos-update-notifier/config.toml (usually
# ~/.config/nixos-update-notifier/config.toml), or point the daemon at it with --config.
#
# When installed via the home-manager module, this file is generated for you from the
# module options — you normally don't edit it by hand in that case.

# Absolute path to your flake repo (the directory containing flake.nix). Required.
flake_path = "/home/youruser/dev/personal/nixos-config"

# The nixosConfigurations.<name> attribute to evaluate and rebuild. Required.
host_attr = "nixos-x1"

# Inputs to advance during a check/apply.
#   - If omitted or empty: ALL inputs are candidates, minus `exclude_inputs`.
#   - If set: ONLY these inputs are advanced (still minus `exclude_inputs`).
# update_inputs = ["nixpkgs", "home-manager"]

# Inputs that must NEVER be advanced. This is the safety valve for deliberately
# rev-pinned inputs. Classic example: a `nixpkgs-kernel` input pinned to an immutable
# commit that provides your kernel + ZFS — advancing it could break ZFS-on-root.
exclude_inputs = ["nixpkgs-kernel"]

# Background check cadence, in seconds. Default: 21600 (6 hours). Minimum: 60.
interval = 21600

# Fire desktop notifications when updates appear.
notify = true

# Which nixpkgs to resolve meta.changelog against when rendering the update list.
# If omitted, the `nixpkgs` recorded in the candidate lock is used: the revision the
# pending update would actually install, already fetched by the check, so reading it
# downloads nothing. Set this only if your flake names its nixpkgs something else.
#
# Pin whatever you set to a revision. A branch or channel ref ("nixpkgs",
# "github:NixOS/nixpkgs/nixos-unstable") downloads on every check and describes whatever
# that ref points at today rather than the version being offered; you will be warned.
# The ref also has to be nixpkgs-shaped — attributes are read from legacyPackages.<system>,
# for the system this machine evaluates as.
# nixpkgs_ref_for_changelogs = "github:NixOS/nixpkgs/04607e1165ac22c5fde6dcc54c9e0b3c0487c555"

# NOTE: there is deliberately no `rebuild_extra_args` option. Arbitrary arguments
# forwarded into root's `nixos-rebuild` would let anything that can write this file change
# what root evaluates and builds — more than "rebuild my machine", and not shown on the
# polkit prompt. Setting it now fails config parsing rather than being silently ignored.

# Icon names per tray state. The defaults below are verified to exist in Breeze (KDE's
# default theme) — an icon name the theme cannot resolve makes the tray item render as a
# blank gap, with no error logged anywhere, so change these only to names you have checked.
#
# On a non-KDE desktop, or to use the Nix logo (needs the `nixos-icons` package), override:
#   idle = "nix-snowflake"
#
# [icons]
# idle = "update-none"
# checking = "view-refresh"
# system_changes = "update-low"         # inputs moved but no package changed version
# updates_available = "update-medium"   # "update-high" is more attention-grabbing
# error = "dialog-error"
